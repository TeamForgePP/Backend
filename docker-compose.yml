services:
  backend:
    image: fastapi-app:local
    container_name: teamforge-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro
    env_file:
      - ./.env
    environment:
      REDIS_URL: ${REDIS_URL}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - redis
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]

  redis:
    image: redis:7-alpine
    container_name: teamforge-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data

volumes:
  redis_data:
